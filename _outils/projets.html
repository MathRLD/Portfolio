<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Projets | RAWLAND</title>
<!-- Page de l'outil local (_outils/projets.js) : ne fonctionne que
     lancée par ce serveur, qui lit et enregistre les fichiers du site. -->
<style>
  @font-face {
    font-family: "Clash Display";
    src: url("/assets/webfonts/ClashDisplay-Bold.woff2") format("woff2");
    font-weight: 100 900;
  }
  :root {
    --bg: #111111;
    --panel: #1a1a1a;
    --line: #2c2c2c;
    --text: #f4f4f2;
    --muted: #8a8a86;
    --accent: #a8322d;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font: 14px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  button, input, textarea, select { font: inherit; color: inherit; }

  /* ---------- en-tête ---------- */
  header {
    position: sticky;
    top: 0;
    z-index: 5;
    display: flex;
    align-items: center;
    gap: 28px;
    padding: 14px 24px;
    background: var(--bg);
    border-bottom: 1px solid var(--line);
  }
  h1 {
    margin: 0;
    font-family: "Clash Display", sans-serif;
    font-size: 22px;
    letter-spacing: -0.02em;
  }
  .tabs { display: flex; gap: 4px; }
  .tabs button {
    padding: 6px 14px;
    border: 1px solid var(--line);
    background: none;
    cursor: pointer;
    text-transform: uppercase;
    letter-spacing: 1px;
    font-size: 12px;
  }
  .tabs button.is-active { background: var(--text); color: var(--bg); border-color: var(--text); }
  header a { color: var(--muted); font-size: 13px; }
  header a:hover { color: var(--text); }
  #publish-open { margin-left: auto; }
  #publish-open .count {
    display: inline-block;
    min-width: 18px;
    margin-left: 6px;
    padding: 0 5px;
    background: var(--accent);
    color: var(--text);
    font-size: 11px;
    text-align: center;
  }
  #publish-open .count:empty { display: none; }

  /* ---------- mise en page ---------- */
  main {
    display: grid;
    grid-template-columns: 290px 1fr;
    min-height: calc(100vh - 61px);
  }
  main.is-wide { grid-template-columns: 1fr; }
  main.is-wide #list { display: none; }
  #list { border-right: 1px solid var(--line); }
  .item {
    display: flex;
    gap: 12px;
    align-items: center;
    width: 100%;
    padding: 10px 16px;
    border: 0;
    border-bottom: 1px solid var(--line);
    background: none;
    text-align: left;
    cursor: pointer;
  }
  .item:hover { background: #161616; }
  .item.is-active { background: var(--panel); }
  .item img { flex: 0 0 auto; width: 52px; height: 52px; object-fit: cover; }
  .item small { display: block; color: var(--muted); font-size: 12px; }
  .badge {
    display: inline-block;
    margin-top: 2px;
    padding: 0 6px;
    border: 1px solid var(--muted);
    font-size: 10px;
    letter-spacing: 0.5px;
    color: var(--muted);
    text-transform: uppercase;
  }

  #editor { padding: 24px 32px 120px; }
  #editor h2 {
    margin: 0 0 6px;
    font-family: "Clash Display", sans-serif;
    font-size: 30px;
    letter-spacing: -0.02em;
  }
  .hint { margin: 0; color: var(--muted); }
  .block {
    margin-top: 28px;
    padding-top: 22px;
    border-top: 1px solid var(--line);
  }
  /* carte et vignette de l'anneau côte à côte quand la place le permet */
  .blocks {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(440px, 1fr));
    column-gap: 48px;
    align-items: start;
  }
  h3 {
    margin: 0 0 14px;
    font-size: 12px;
    font-weight: 600;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    color: var(--muted);
  }
  .row { display: flex; gap: 28px; align-items: flex-start; flex-wrap: wrap; }
  .side { display: flex; flex-direction: column; gap: 14px; max-width: 300px; }
  .side .hint { font-size: 13px; }

  /* ---------- aperçus (glisser pour cadrer) ---------- */
  .frame {
    position: relative;
    overflow: hidden;
    background: #000;
    cursor: grab;
    touch-action: none;
  }
  .frame.is-static { cursor: default; }
  .frame.is-dragging { cursor: grabbing; }
  .frame.is-drop { outline: 2px dashed var(--text); outline-offset: 4px; }
  .frame img {
    position: absolute;
    max-width: none;
    pointer-events: none;
    user-select: none;
  }
  .frame--card { width: min(420px, 100%); aspect-ratio: 16 / 10; }
  .frame--card.is-square { width: min(300px, 100%); aspect-ratio: 1; }
  .frame--orbit { width: 180px; aspect-ratio: 3 / 4; border-radius: 16px; }
  .frame--orbit.is-off { opacity: 0.45; }

  .btn {
    padding: 9px 18px;
    border: 1.5px solid var(--text);
    background: none;
    cursor: pointer;
    font-size: 13px;
    font-weight: 600;
  }
  .btn.primary { background: var(--text); color: var(--bg); }
  .btn.primary:not(:disabled):hover { background: var(--accent); border-color: var(--accent); color: var(--text); }
  .btn:disabled { opacity: 0.35; cursor: default; }
  .btn.small { padding: 5px 12px; font-size: 12px; align-self: flex-start; }

  .seg { display: inline-flex; border: 1px solid var(--line); }
  .seg button { padding: 7px 14px; border: 0; background: none; cursor: pointer; font-size: 13px; }
  .seg button.is-active { background: var(--text); color: var(--bg); }

  label.check { display: inline-flex; gap: 8px; align-items: center; cursor: pointer; }
  .zoom { display: flex; gap: 10px; align-items: center; font-size: 13px; color: var(--muted); }
  .zoom input { width: 180px; accent-color: var(--text); }

  /* ---------- choix d'image ---------- */
  .choices {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(76px, 1fr));
    gap: 8px;
    max-width: 1000px;
    margin-top: 18px;
  }
  .choices button {
    position: relative;
    padding: 0;
    border: 0;
    outline: 2px solid transparent;
    outline-offset: 2px;
    background: #000;
    aspect-ratio: 1;
    overflow: hidden;
    cursor: pointer;
  }
  .choices button:hover { outline-color: var(--muted); }
  .choices button.is-selected { outline-color: var(--text); }
  .choices img { display: block; width: 100%; height: 100%; object-fit: cover; }
  .choices .tag {
    position: absolute;
    left: 4px;
    bottom: 4px;
    padding: 1px 6px;
    background: rgba(0,0,0,0.75);
    font-size: 10px;
    letter-spacing: 0.5px;
    text-transform: uppercase;
  }
  .choices .import {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 4px;
    background: var(--panel);
    border: 1px dashed var(--muted);
    color: var(--muted);
    font-size: 12px;
  }
  .choices .import span { font-size: 26px; line-height: 1; }

  /* ---------- barre d'enregistrement ---------- */
  .savebar {
    position: fixed;
    right: 0;
    bottom: 0;
    left: 290px;
    display: flex;
    gap: 12px;
    align-items: center;
    padding: 14px 32px;
    background: rgba(17,17,17,0.94);
    border-top: 1px solid var(--line);
  }
  main.is-wide .savebar { left: 0; }
  #status { color: var(--muted); font-size: 13px; }
  #status.is-ok { color: #7ccf8f; }
  #status.is-error { color: #ff7a6e; }

  /* ---------- onglet anneau ---------- */
  .ring {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
    gap: 14px;
    max-width: 1200px;
  }
  .ring figure { margin: 0; }
  .ring .thumb { position: relative; aspect-ratio: 3 / 4; border-radius: 14px; overflow: hidden; background: #000; }
  .ring .thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .ring .num {
    position: absolute;
    top: 6px;
    left: 6px;
    min-width: 22px;
    padding: 1px 6px;
    background: var(--text);
    color: var(--bg);
    font-size: 12px;
    font-weight: 700;
    text-align: center;
  }
  .ring figcaption { margin-top: 6px; font-size: 12px; line-height: 1.35; }
  .ring .tools { display: flex; gap: 4px; margin-top: 6px; }
  .ring .tools button {
    flex: 1;
    padding: 3px 0;
    border: 1px solid var(--line);
    background: none;
    cursor: pointer;
  }
  .ring .tools button:hover:not(:disabled) { border-color: var(--text); }
  .ring .tools button:disabled { opacity: 0.3; cursor: default; }
  .ring--add .thumb { opacity: 0.6; }
  .ring--add figure:hover .thumb { opacity: 1; }
  .empty { color: var(--muted); }

  /* ---------- onglet ordre des carrousels ---------- */
  .block .hint + .ring { margin-top: 14px; }
  .ring.order { grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); }
  .ring.order.is-square { grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); }
  .ring.order .thumb { aspect-ratio: 16 / 10; border-radius: 4px; }
  .ring.order.is-square .thumb { aspect-ratio: 1; }
  .ring .thumb[draggable="true"] { cursor: grab; }
  .ring.order figure.is-dragging { opacity: 0.35; }
  .ring.order figure.is-over .thumb { outline: 2px solid var(--text); outline-offset: 3px; }
  .ring .flag {
    position: absolute;
    top: 6px;
    right: 6px;
    padding: 1px 6px;
    background: var(--accent);
    font-size: 10px;
    letter-spacing: 0.5px;
    text-transform: uppercase;
  }

  /* ---------- fenêtre de publication ---------- */
  dialog {
    width: min(620px, calc(100vw - 32px));
    padding: 24px 28px;
    border: 1px solid var(--line);
    background: var(--panel);
    color: var(--text);
  }
  dialog::backdrop { background: rgba(0,0,0,0.6); }
  dialog h2 {
    margin: 0 0 6px;
    font-family: "Clash Display", sans-serif;
    font-size: 26px;
    letter-spacing: -0.02em;
  }
  .changes {
    max-height: 240px;
    margin: 16px 0;
    padding: 8px 0;
    overflow-y: auto;
    border-top: 1px solid var(--line);
    border-bottom: 1px solid var(--line);
    list-style: none;
    font-size: 13px;
  }
  .changes:empty { display: none; }
  .changes li { display: flex; gap: 10px; padding: 2px 0; }
  .changes .what { flex: 0 0 70px; color: var(--muted); }
  .changes .file { overflow-wrap: anywhere; }
  .field { display: flex; flex-direction: column; gap: 6px; color: var(--muted); font-size: 13px; }
  .field small { margin-left: 6px; font-size: 12px; opacity: 0.75; }
  .field input, .field textarea, .field select {
    padding: 8px 10px;
    border: 1px solid var(--line);
    background: var(--bg);
    color: var(--text);
    font-size: 14px;
  }
  .field textarea { resize: vertical; line-height: 1.5; }
  .field input:focus, .field textarea:focus, .field select:focus { outline: none; border-color: var(--muted); }
  .field[hidden] { display: none; }

  /* ---------- textes, vidéo et galerie d'un projet ---------- */
  .form { display: grid; gap: 14px; max-width: 860px; }
  .form-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 14px; }
  .form .hint { margin-top: -6px; font-size: 13px; }
  .hint.is-error { color: #ff7a6e; }
  .hint a { color: var(--text); }
  .cover-preview {
    position: relative;
    width: min(420px, 100%);
    aspect-ratio: 16 / 9;
    overflow: hidden;
    background: #000;
  }
  .cover-preview img { display: block; width: 100%; height: 100%; object-fit: cover; }
  .cover-preview.is-drop, #gallery-block.is-drop { outline: 2px dashed var(--text); outline-offset: 6px; }
  .cover-preview.is-empty img, .frame.is-empty img { display: none; }
  .cover-preview.is-empty::after, .frame.is-empty::after {
    content: "Aucune image";
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--muted);
    font-size: 13px;
  }
  #editor, .gallery figure { min-width: 0; } /* les champs ne doivent pas élargir la page */
  .gallery textarea {
    width: 100%;
    margin-top: 6px;
    padding: 5px 7px;
    border: 1px solid var(--line);
    background: var(--bg);
    color: var(--text);
    font-size: 12px;
    line-height: 1.35;
    resize: vertical;
  }
  .gallery textarea:focus { outline: none; border-color: var(--muted); }
  .add-tile {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 4px;
    aspect-ratio: 1;
    border: 1px dashed var(--muted);
    background: var(--panel);
    color: var(--muted);
    font-size: 12px;
    cursor: pointer;
  }
  .add-tile span { font-size: 28px; line-height: 1; }
  .add-tile:hover { border-color: var(--text); color: var(--text); }
  .item--new { color: var(--muted); }
  .item--new .plus {
    display: flex;
    flex: 0 0 auto;
    align-items: center;
    justify-content: center;
    width: 52px;
    height: 52px;
    border: 1px dashed var(--muted);
    font-size: 24px;
  }
  .item--new:hover, .item--new.is-active { color: var(--text); }
  .warn { margin: 14px 0 0; color: #f0b35e; font-size: 13px; }
  .warn:empty { display: none; }
  #publish-status { min-height: 1.5em; margin: 14px 0 0; color: var(--muted); font-size: 13px; }
  #publish-status.is-ok { color: #7ccf8f; }
  #publish-status.is-error { color: #ff7a6e; }
  #publish-log {
    max-height: 160px;
    margin: 10px 0 0;
    padding: 10px;
    overflow: auto;
    background: var(--bg);
    color: var(--muted);
    font-size: 12px;
    white-space: pre-wrap;
  }
  dialog .actions { display: flex; gap: 12px; margin-top: 18px; }
</style>
</head>
<body>

<header>
  <h1>Projets.</h1>
  <nav class="tabs" id="tabs">
    <button type="button" data-tab="photos">Photos</button>
    <button type="button" data-tab="videos">Vidéos</button>
    <button type="button" data-tab="graphisme">Graphisme</button>
    <button type="button" data-tab="order">Ordre des carrousels</button>
    <button type="button" data-tab="orbit">Anneau du hero</button>
  </nav>
  <button type="button" class="btn small" id="publish-open" title="Envoyer les changements sur GitHub">Publier<span class="count"></span></button>
  <a href="/index.html" target="_blank">Voir le site ↗</a>
</header>

<main id="main">
  <aside id="list"></aside>
  <section id="editor"></section>
  <div class="savebar">
    <button type="button" class="btn primary" id="save">Enregistrer</button>
    <button type="button" class="btn" id="reset">Annuler</button>
    <span id="status"></span>
  </div>
</main>

<input type="file" id="file" accept="image/jpeg,image/png,image/webp,image/avif" hidden>

<dialog id="publish">
  <h2>Publier le site</h2>
  <p class="hint" id="publish-intro"></p>
  <p class="warn" id="publish-warn"></p>
  <ul class="changes" id="publish-changes"></ul>
  <label class="field" id="publish-field">Description des changements
    <input type="text" id="publish-message" maxlength="200" value="Mise à jour des projets">
  </label>
  <p id="publish-status"></p>
  <pre id="publish-log" hidden></pre>
  <div class="actions">
    <button type="button" class="btn primary" id="publish-go">Publier</button>
    <button type="button" class="btn" id="publish-close">Fermer</button>
  </div>
</dialog>

<script>
  const CATEGORIES = ["videos", "photos", "graphisme"];
  const CATEGORY_LABEL = { photos: "photos", videos: "vidéos", graphisme: "graphisme" };
  const CATEGORY_TITLE = { photos: "Photos", videos: "Vidéos", graphisme: "Graphisme" };
  const HERO_SIZE = { w: 480, h: 640 };   // vignette de l'anneau (3:4)
  const CARD_MAX_W = 1000;                 // miniature de carte (image entière)

  let data = null;         // { projects, heroOrbit }
  let tab = "photos";
  let project = null;      // projet affiché
  let draft = null;        // état en cours d'édition
  let saved = null;        // état tel qu'enregistré
  let orbitDraft = null;   // ids de l'anneau (onglet anneau)
  let orderDraft = null;   // { videos: [ids], ... } (onglet ordre)
  let uploadTarget = null; // "card" | "hero" : destination de l'import en cours
  let uploads = { card: null, hero: null }; // dernière image importée par zone

  const $ = (sel, root = document) => root.querySelector(sel);
  const mainEl = $("#main");
  const listEl = $("#list");
  const editorEl = $("#editor");
  const saveBtn = $("#save");
  const resetBtn = $("#reset");
  const fileInput = $("#file");

  const url = (src) => (/^(blob:|data:)/.test(src) ? src : "/" + encodeURI(src));
  const clamp = (v) => Math.min(100, Math.max(0, v));
  const pos = (s) => `${Math.round(s.x)}% ${Math.round(s.y)}%`;
  const same = (a, b) => JSON.stringify(a) === JSON.stringify(b);

  const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
  const move = (list, from, to) => list.splice(to, 0, ...list.splice(from, 1));

  function allProjects() {
    return CATEGORIES.flatMap((c) => data.projects[c].map((p) => ({ ...p, category: c })));
  }
  function byId(id) {
    return allProjects().find((p) => p.id === id);
  }
  // Image + cadrage affichés dans l'anneau pour un projet (sur le site).
  function orbitImage(p) {
    return p.heroThumb
      ? { src: p.heroThumb, position: "50% 50%" }
      : { src: p.thumb || p.cover, position: p.thumbPosition || "50% 50%" };
  }

  /* =========================================================
     Chargement et navigation
     ========================================================= */
  async function loadData(keepId) {
    data = await (await fetch("/api/data", { cache: "no-store" })).json();
    showTab(tab, keepId);
  }

  function heroChanged() {
    return draft.hero.mode !== saved.hero.mode || (draft.hero.mode === "custom" && !same(draft.hero, saved.hero));
  }

  function isDirty() {
    if (tab === "orbit") return orbitDraft && !same(orbitDraft, data.heroOrbit);
    if (tab === "order") return orderDraft && !same(orderDraft, currentOrder());
    if (!draft || !saved) return false;
    return ["info", "video", "cover", "gallery", "card"].some((k) => !same(draft[k], saved[k]))
      || heroChanged() || draft.inOrbit !== saved.inOrbit;
  }

  function confirmLeave() {
    return !isDirty() || confirm("Les changements ne sont pas enregistrés. Continuer quand même ?");
  }

  function showTab(next, keepId) {
    tab = next;
    document.querySelectorAll("#tabs button").forEach((b) => b.classList.toggle("is-active", b.dataset.tab === tab));
    mainEl.classList.toggle("is-wide", tab === "orbit" || tab === "order");
    if (tab === "orbit") {
      orbitDraft = [...data.heroOrbit];
      renderOrbitTab();
    } else if (tab === "order") {
      orderDraft = currentOrder();
      renderOrderTab();
    } else {
      renderList();
      const list = data.projects[tab];
      const p = list.find((x) => x.id === keepId) || list[0];
      if (p) select(p);
      else selectNew();
    }
  }

  document.querySelectorAll("#tabs button").forEach((b) => {
    b.addEventListener("click", () => {
      if (b.dataset.tab !== tab && confirmLeave()) showTab(b.dataset.tab);
    });
  });

  function renderList() {
    listEl.innerHTML = "";
    const add = document.createElement("button");
    add.type = "button";
    add.className = "item item--new";
    add.innerHTML = `<span class="plus">+</span><span>Nouveau projet<small>${CATEGORY_TITLE[tab]}</small></span>`;
    add.addEventListener("click", () => {
      if (!project?.isNew && confirmLeave()) selectNew();
    });
    listEl.appendChild(add);
    data.projects[tab].forEach((p) => {
      const item = document.createElement("button");
      item.type = "button";
      item.className = "item";
      item.dataset.id = p.id;
      const inRing = data.heroOrbit.includes(p.id);
      item.innerHTML = `<img src="${url(p.thumb || p.cover)}" alt="" style="object-position:${p.thumbPosition || "50% 50%"}">
        <span>${esc(p.title)}${p.client ? `<small>${esc(p.client)}</small>` : ""}${inRing ? `<span class="badge">Anneau</span>` : ""}</span>`;
      item.addEventListener("click", () => {
        if (p.id !== project?.id && confirmLeave()) select(p);
      });
      listEl.appendChild(item);
    });
  }

  /* =========================================================
     Onglets photos / vidéos / graphisme : un projet
     ========================================================= */
  const FRAMES = ["Projet client", "Projet personnel", "Projet étudiant"]; // 1er tag des projets graphisme
  const WEB_MAX = 2000; // grand côté des images de galerie et des couvertures
  let pending = new Map(); // URL blob: -> { blob, name } : images préparées, pas encore enregistrées

  function videoLink(media) {
    if (!media || !media.src) return "";
    if (media.type === "youtube") return `https://www.youtube.com/watch?v=${media.src}`;
    if (media.type === "vimeo") return `https://vimeo.com/${media.src}`;
    return media.src;
  }

  // Lien YouTube (watch, youtu.be, Shorts, embed), Vimeo, ou identifiant
  // YouTube seul -> { type, src, shorts? } ; null si non reconnu.
  function parseVideoLink(text) {
    const s = String(text || "").trim();
    if (/^[\w-]{11}$/.test(s)) return { type: "youtube", src: s };
    let u;
    try { u = new URL(/^https?:\/\//i.test(s) ? s : "https://" + s); } catch { return null; }
    const host = u.hostname.replace(/^(www|m|music)\./, "");
    let id = null;
    if (host === "youtu.be") id = u.pathname.split("/")[1];
    if (host === "youtube.com" || host === "youtube-nocookie.com") {
      id = u.searchParams.get("v") || (/^\/(?:shorts|embed|live|v)\/([\w-]{11})/.exec(u.pathname) || [])[1];
    }
    if (id && /^[\w-]{11}$/.test(id)) return { type: "youtube", src: id, shorts: u.pathname.startsWith("/shorts/") };
    if (host === "vimeo.com" || host === "player.vimeo.com") {
      const m = /\/(\d{5,})(?:\/|$)/.exec(u.pathname);
      if (m) return { type: "vimeo", src: m[1] };
    }
    return null;
  }

  function initialState(p) {
    const [x, y] = (p.thumbPosition || "50% 50%").split(" ").map(parseFloat);
    const thumb = p.thumb || p.cover || null;
    const tags = p.tags || [];
    const framed = tab === "graphisme" && FRAMES.includes(tags[0]);
    return {
      info: {
        title: p.title || "",
        client: p.client || "",
        description: p.description || "",
        frame: tab !== "graphisme" ? null : framed ? tags[0] : p.isNew ? FRAMES[1] : "",
        tags: (framed ? tags.slice(1) : tags).join(", "),
      },
      video: tab === "videos" ? { link: videoLink(p.media), vertical: Boolean(p.media && p.media.vertical) } : null,
      cover: tab === "videos" ? p.cover || null : null,
      gallery: tab === "videos"
        ? null
        : (p.images || []).map((img) => (typeof img === "string" ? { src: img, alt: p.title } : { src: img.src, alt: img.alt || "" })),
      card: p.isNew ? { kind: "gallery", src: null, x: 50, y: 50 } : { kind: "current", src: thumb, x, y },
      hero: p.heroThumb
        ? { mode: "custom", kind: "current", src: p.heroThumb, x: 50, y: 50, zoom: 1 }
        : { mode: "same", kind: "card", src: thumb, x, y, zoom: 1 },
      inOrbit: data.heroOrbit.includes(p.id),
    };
  }

  function select(p) {
    project = { ...p, category: tab };
    pending.forEach((_, src) => URL.revokeObjectURL(src));
    pending = new Map();
    uploads = { card: null, hero: null };
    saved = initialState(project);
    draft = structuredClone(saved);
    listEl.querySelectorAll(".item").forEach((el) => {
      el.classList.toggle("is-active", project.isNew ? el.classList.contains("item--new") : el.dataset.id === project.id);
    });
    renderProject();
  }

  function selectNew() {
    select({ isNew: true, id: null, title: "", client: "", description: "", cover: "", tags: [], images: [] });
  }

  // Images proposées pour la miniature : la galerie (ou la couverture d'une vidéo).
  function cardSources() {
    if (tab === "videos") return draft.cover ? [draft.cover] : [];
    const srcs = draft.gallery.map((g) => g.src);
    if (!project.isNew && project.cover && !srcs.includes(project.cover)) srcs.unshift(project.cover);
    return srcs;
  }

  // Après un changement de galerie ou de couverture, la miniature et la
  // vignette ne doivent pas rester sur une image retirée.
  function syncImageRefs() {
    const srcs = cardSources();
    if (draft.card.kind === "gallery" && !srcs.includes(draft.card.src)) {
      draft.card = project.isNew ? { kind: "gallery", src: srcs[0] || null, x: 50, y: 50 } : structuredClone(saved.card);
    }
    const h = draft.hero;
    if (h.mode === "custom" && h.kind === "gallery" && !srcs.includes(h.src)) draft.hero = structuredClone(saved.hero);
  }

  function renderProject() {
    const square = tab === "photos";
    const isVideo = tab === "videos";
    editorEl.innerHTML = `
      <h2 id="project-title"></h2>
      <p class="hint">${project.isNew
        ? `Nouveau projet ${CATEGORY_LABEL[tab]} : il sera ajouté à la fin du carrousel.`
        : `Identifiant : ${esc(project.id)}`}</p>

      <section class="block">
        <h3>Textes</h3>
        <div class="form">
          <div class="form-row">
            <label class="field"><span>Titre</span><input type="text" data-info="title" maxlength="200"></label>
            <label class="field"><span>Sous-titre <small>client ou contexte, affiché sous le titre</small></span><input type="text" data-info="client" maxlength="200"></label>
          </div>
          ${tab === "graphisme" ? `
          <label class="field"><span>Cadre <small>premier mot-clé de la popup</small></span>
            <select data-info="frame"><option value="">Aucun</option>${FRAMES.map((f) => `<option>${f}</option>`).join("")}</select></label>` : ""}
          <label class="field"><span>Description</span><textarea data-info="description" rows="4" maxlength="3000"></textarea></label>
          <label class="field"><span>Mots-clés <small>séparés par des virgules</small></span><input type="text" data-info="tags" placeholder="Sport, Reportage"></label>
        </div>
      </section>

      ${isVideo ? `
      <section class="block">
        <h3>Vidéo</h3>
        <div class="form">
          <label class="field"><span>Lien YouTube ou Vimeo</span><input type="text" id="video-link" placeholder="https://www.youtube.com/watch?v=…"></label>
          <p class="hint" id="video-status"></p>
          <label class="check"><input type="checkbox" id="video-vertical"> Vidéo verticale (Shorts, Reels) : la popup s'affiche en portrait</label>
        </div>
        <div class="row" style="margin-top:20px">
          <div class="cover-preview" id="cover-preview"><img alt=""></div>
          <div class="side">
            <p class="hint">Image de couverture, affichée dans la popup avant la lecture. Redimensionnée et compressée automatiquement.</p>
            <button type="button" class="btn small" id="cover-upload">Importer une image</button>
            <button type="button" class="btn small" id="cover-youtube">Prendre l'image YouTube</button>
          </div>
        </div>
      </section>` : `
      <section class="block" id="gallery-block">
        <h3>Galerie <span id="gallery-count"></span></h3>
        <p class="hint">Les images de la popup, dans l'ordre. Glisse tes fichiers ici ou clique sur « Ajouter » :
          ils sont redimensionnés (${WEB_MAX} px max) et compressés automatiquement.
          ${tab === "graphisme" ? "La 1re image est la grande image en haut de la popup. " : ""}Le texte sous chaque image la décrit
          (lecteurs d'écran, Google).</p>
        <div class="ring order is-square gallery" id="gallery"></div>
      </section>`}

      <div class="blocks">
      <section class="block">
        <h3>Miniature de la carte</h3>
        <div class="row">
          <div class="frame frame--card${square ? " is-square" : ""}" data-target="card"><img alt=""></div>
          <div class="side">
            <p class="hint">Carte du carrousel ${CATEGORY_LABEL[tab]}. Fais glisser l'image pour la cadrer ; l'image reste entière, le site applique le cadrage.</p>
            <button type="button" class="btn small" data-center="card">Recentrer</button>
          </div>
        </div>
        <div class="choices" data-choices="card"></div>
      </section>

      <section class="block">
        <h3>Vignette de l'anneau du hero</h3>
        <label class="check"><input type="checkbox" id="in-orbit"> Ce projet apparaît dans l'anneau</label>
        <div class="row" style="margin-top:16px">
          <div class="frame frame--orbit" data-target="hero"><img alt=""></div>
          <div class="side">
            <div class="seg" id="hero-mode">
              <button type="button" data-mode="same">Comme la miniature</button>
              <button type="button" data-mode="custom">Vignette dédiée</button>
            </div>
            <p class="hint" id="hero-hint"></p>
            <div class="zoom" id="hero-zoom">Zoom <input type="range" min="1" max="3" step="0.01"></div>
            <button type="button" class="btn small" data-center="hero">Recentrer</button>
          </div>
        </div>
        <div class="choices" data-choices="hero"></div>
      </section>
      </div>
    `;

    editorEl.querySelectorAll("[data-info]").forEach((el) => {
      el.value = draft.info[el.dataset.info] ?? "";
      el.addEventListener("input", () => {
        draft.info[el.dataset.info] = el.value;
        updateTitle();
        updateSavebar();
      });
    });
    updateTitle();

    if (isVideo) {
      const link = $("#video-link");
      link.value = draft.video.link;
      link.addEventListener("input", () => {
        draft.video.link = link.value;
        if (parseVideoLink(link.value)?.shorts) draft.video.vertical = true;
        updateVideo();
        updateSavebar();
      });
      $("#video-vertical").addEventListener("change", (e) => { draft.video.vertical = e.target.checked; updateSavebar(); });
      $("#cover-upload").addEventListener("click", () => openFiles("cover"));
      $("#cover-youtube").addEventListener("click", useYoutubeCover);
      enableFileDrop($("#cover-preview"), (files) => setCoverFile(files[0]));
      updateVideo();
    } else {
      enableFileDrop($("#gallery-block"), addGalleryFiles);
      renderGallery();
    }

    editorEl.querySelectorAll(".frame").forEach(enableFrame);
    editorEl.querySelectorAll("[data-center]").forEach((b) => {
      b.addEventListener("click", () => {
        const s = draft[b.dataset.center];
        s.x = 50; s.y = 50;
        if ("zoom" in s) s.zoom = 1;
        update();
      });
    });
    $("#in-orbit").addEventListener("change", (e) => { draft.inOrbit = e.target.checked; update(); });
    editorEl.querySelectorAll("#hero-mode button").forEach((b) => {
      b.addEventListener("click", () => {
        if (draft.hero.mode === b.dataset.mode) return;
        draft.hero = b.dataset.mode === "same"
          ? { mode: "same", kind: "card", src: draft.card.src, x: 50, y: 50, zoom: 1 }
          : saved.hero.mode === "custom"
            ? structuredClone(saved.hero)
            : { mode: "custom", kind: "card", src: draft.card.src, x: draft.card.x, y: draft.card.y, zoom: 1 };
        renderChoices();
        update();
      });
    });
    $("#hero-zoom input").addEventListener("input", (e) => { draft.hero.zoom = parseFloat(e.target.value); update(); });

    renderChoices();
    update();
  }

  function updateTitle() {
    $("#project-title").textContent = draft.info.title.trim() || (project.isNew ? "Nouveau projet" : "Sans titre");
  }

  /* ---------- vidéo : lien et couverture ---------- */
  function updateVideo() {
    const media = parseVideoLink(draft.video.link);
    const keptFile = draft.video.link === saved.video.link && project.media?.type === "file";
    const status = $("#video-status");
    status.className = "hint";
    if (keptFile) {
      status.textContent = "Fichier vidéo hébergé sur le site.";
    } else if (!draft.video.link.trim()) {
      status.textContent = "Colle le lien de la vidéo (page YouTube, youtu.be, Shorts ou Vimeo).";
    } else if (!media) {
      status.textContent = "Lien non reconnu : colle un lien YouTube ou Vimeo.";
      status.className = "hint is-error";
    } else {
      status.innerHTML = `${media.type === "youtube" ? "YouTube" : "Vimeo"} · ${esc(media.src)} · <a href="${esc(videoLink(media))}" target="_blank">voir la vidéo ↗</a>`;
    }
    $("#video-vertical").checked = draft.video.vertical;
    $("#cover-youtube").disabled = media?.type !== "youtube";
    const preview = $("#cover-preview");
    const img = preview.querySelector("img");
    preview.classList.toggle("is-empty", !draft.cover);
    if (draft.cover && img.dataset.src !== draft.cover) {
      img.dataset.src = draft.cover;
      img.src = url(draft.cover);
    }
  }

  async function setCoverFile(file) {
    const d = draft;
    try {
      setStatus("Préparation de l'image…");
      const src = await prepareImage(file);
      if (draft !== d) return;
      draft.cover = src;
      syncImageRefs();
      updateVideo();
      renderChoices();
      update();
    } catch (err) {
      setStatus(err.message, "error");
    }
  }

  async function useYoutubeCover() {
    const media = parseVideoLink(draft.video.link);
    if (media?.type !== "youtube") return;
    setStatus("Récupération de l'image YouTube…");
    try {
      const res = await fetch(`/api/youtube-cover?id=${encodeURIComponent(media.src)}`);
      if (!res.ok) throw new Error((await res.json().catch(() => ({}))).error || "Image YouTube introuvable.");
      await setCoverFile(new File([await res.blob()], `youtube-${media.src}.jpg`, { type: "image/jpeg" }));
    } catch (err) {
      setStatus(err.message, "error");
    }
  }

  /* ---------- galerie (photos, graphisme) ---------- */
  function renderGallery() {
    const box = $("#gallery");
    $("#gallery-count").textContent = `(${draft.gallery.length})`;
    box.innerHTML = draft.gallery.map((g, i) => `
      <figure data-index="${i}">
        <div class="thumb"><img src="${url(g.src)}" alt="" draggable="false"><span class="num">${i + 1}</span>${pending.has(g.src) ? `<span class="flag">Nouvelle</span>` : ""}</div>
        <textarea rows="2" maxlength="300" placeholder="Ce que montre l'image"></textarea>
        <div class="tools">
          <button type="button" data-act="left" title="Avancer" ${i === 0 ? "disabled" : ""}>←</button>
          <button type="button" data-act="right" title="Reculer" ${i === draft.gallery.length - 1 ? "disabled" : ""}>→</button>
          <button type="button" data-act="remove" title="Retirer de la galerie">×</button>
        </div>
      </figure>`).join("") + `
      <button type="button" class="add-tile" id="gallery-add"><span>+</span>Ajouter des images</button>`;
    box.querySelectorAll("figure").forEach((fig) => {
      const i = Number(fig.dataset.index);
      const alt = fig.querySelector("textarea");
      alt.value = draft.gallery[i].alt;
      alt.addEventListener("input", () => { draft.gallery[i].alt = alt.value; updateSavebar(); });
      fig.querySelectorAll("[data-act]").forEach((b) => {
        b.addEventListener("click", () => {
          if (b.dataset.act === "remove") draft.gallery.splice(i, 1);
          else move(draft.gallery, i, b.dataset.act === "left" ? i - 1 : i + 1);
          galleryChanged();
        });
      });
    });
    sortable(box, draft.gallery, galleryChanged);
    $("#gallery-add").addEventListener("click", () => openFiles("gallery"));
  }

  function galleryChanged() {
    syncImageRefs();
    renderGallery();
    renderChoices();
    update();
  }

  async function addGalleryFiles(files) {
    const d = draft;
    const errors = [];
    for (const [n, file] of files.entries()) {
      setStatus(`Préparation des images ${n + 1}/${files.length}…`);
      try {
        const src = await prepareImage(file);
        if (draft !== d) return;
        draft.gallery.push({ src, alt: "" });
        galleryChanged();
      } catch (err) {
        errors.push(err.message);
      }
    }
    if (errors.length) setStatus(errors.join(" · "), "error");
  }

  /* ---------- fichiers ---------- */
  function openFiles(target) {
    uploadTarget = target;
    fileInput.multiple = target === "gallery";
    fileInput.value = "";
    fileInput.click();
  }

  fileInput.addEventListener("change", () => {
    const files = [...fileInput.files];
    if (!files.length) return;
    if (uploadTarget === "gallery") addGalleryFiles(files);
    else if (uploadTarget === "cover") setCoverFile(files[0]);
    else useUpload(uploadTarget, files[0]);
  });

  // Dépôt de fichiers depuis l'ordinateur sur une zone.
  function enableFileDrop(el, onFiles) {
    const hasFiles = (e) => [...(e.dataTransfer?.types || [])].includes("Files");
    el.addEventListener("dragover", (e) => {
      if (!hasFiles(e)) return;
      e.preventDefault();
      el.classList.add("is-drop");
    });
    el.addEventListener("dragleave", (e) => {
      if (!el.contains(e.relatedTarget)) el.classList.remove("is-drop");
    });
    el.addEventListener("drop", (e) => {
      if (!hasFiles(e)) return;
      e.preventDefault();
      el.classList.remove("is-drop");
      onFiles([...e.dataTransfer.files]);
    });
  }
  // Un fichier lâché à côté d'une zone ne doit pas remplacer la page.
  window.addEventListener("dragover", (e) => e.preventDefault());
  window.addEventListener("drop", (e) => e.preventDefault());

  // Glisser-déposer pour réordonner les <figure data-index> d'un conteneur,
  // en attrapant la carte par son image.
  function sortable(container, list, after) {
    let from = null;
    container.querySelectorAll("figure[data-index]").forEach((fig) => {
      const i = Number(fig.dataset.index);
      fig.querySelector(".thumb").draggable = true;
      fig.addEventListener("dragstart", (e) => {
        from = i;
        e.dataTransfer.effectAllowed = "move";
        e.dataTransfer.setData("text/plain", String(i));
        fig.classList.add("is-dragging");
      });
      fig.addEventListener("dragend", () => {
        from = null;
        container.querySelectorAll("figure").forEach((f) => f.classList.remove("is-dragging", "is-over"));
      });
      fig.addEventListener("dragover", (e) => {
        if (from === null || from === i) return;
        e.preventDefault();
        fig.classList.add("is-over");
      });
      fig.addEventListener("dragleave", (e) => {
        if (!fig.contains(e.relatedTarget)) fig.classList.remove("is-over");
      });
      fig.addEventListener("drop", (e) => {
        if (from === null) return;
        e.preventDefault();
        // la carte déplacée prend la place de celle sur laquelle on la lâche
        move(list, from, i);
        from = null;
        after();
      });
    });
  }

  // Tuiles de choix d'image (galerie du projet + import).
  function renderChoices() {
    const sources = cardSources().map((src) => ({ kind: "gallery", src, tag: pending.has(src) ? "Nouvelle" : "" }));
    const tiles = {
      card: [
        ...(project.isNew ? [] : [{ kind: "current", src: project.thumb || project.cover, tag: "Actuelle" }]),
        ...sources,
      ],
      hero: [
        ...(project.heroThumb ? [{ kind: "current", src: project.heroThumb, tag: "Actuelle" }] : []),
        { kind: "card", src: null, tag: "Miniature" },
        ...sources,
      ],
    };
    ["card", "hero"].forEach((target) => {
      const box = editorEl.querySelector(`[data-choices="${target}"]`);
      box.innerHTML = "";
      box.hidden = target === "hero" && draft.hero.mode === "same";
      tiles[target].forEach((t) => {
        const b = document.createElement("button");
        b.type = "button";
        b.dataset.kind = t.kind;
        if (t.src) b.dataset.src = t.src;
        const shown = t.kind === "card" ? draft.card.src : t.src;
        b.innerHTML = `${shown ? `<img src="${url(shown)}" alt="" loading="lazy">` : ""}${t.tag ? `<span class="tag">${t.tag}</span>` : ""}`;
        b.addEventListener("click", () => {
          const s = draft[target];
          s.kind = t.kind;
          s.src = t.kind === "card" ? draft.card.src : t.src;
          s.x = 50; s.y = 50;
          if (target === "hero") s.zoom = 1;
          update();
        });
        box.appendChild(b);
      });
      // dernière image importée, puis bouton d'import
      if (uploads[target]) {
        const up = document.createElement("button");
        up.type = "button";
        up.dataset.kind = "upload";
        up.innerHTML = `<img src="${uploads[target]}" alt=""><span class="tag">Importée</span>`;
        up.addEventListener("click", () => {
          Object.assign(draft[target], { kind: "upload", src: uploads[target], x: 50, y: 50 }, target === "hero" ? { zoom: 1 } : {});
          update();
        });
        box.appendChild(up);
      }
      const imp = document.createElement("button");
      imp.type = "button";
      imp.className = "import";
      imp.innerHTML = `<span>+</span>Importer`;
      imp.addEventListener("click", () => openFiles(target));
      box.appendChild(imp);
    });
  }

  function useUpload(target, file) {
    if (!file || !file.type.startsWith("image/")) return setStatus("Ce fichier n'est pas une image.", "error");
    const s = draft[target];
    if (target === "hero" && s.mode === "same") draft.hero = { mode: "custom", kind: "upload", src: "", x: 50, y: 50, zoom: 1 };
    const t = draft[target];
    t.kind = "upload";
    t.src = uploads[target] = URL.createObjectURL(file);
    t.x = 50; t.y = 50;
    if (target === "hero") t.zoom = 1;
    renderChoices();
    update();
  }

  // Met à jour les aperçus, les sélections et la barre d'enregistrement.
  function update() {
    if (tab === "orbit" || tab === "order") return updateSavebar();
    // la vignette "comme la miniature" suit la carte en direct
    if (draft.hero.mode === "same") Object.assign(draft.hero, { src: draft.card.src, x: draft.card.x, y: draft.card.y, zoom: 1 });
    else if (draft.hero.kind === "card") draft.hero.src = draft.card.src;

    ["card", "hero"].forEach((target) => {
      const frame = editorEl.querySelector(`.frame[data-target="${target}"]`);
      const img = frame.querySelector("img");
      const s = draft[target];
      frame.classList.toggle("is-empty", !s.src);
      if (img.dataset.src !== (s.src || "")) {
        img.dataset.src = s.src || "";
        img.onload = () => layout(frame);
        if (s.src) img.src = url(s.src);
        else img.removeAttribute("src");
      }
      layout(frame);
      editorEl.querySelectorAll(`[data-choices="${target}"] button`).forEach((b) => {
        const selected = b.dataset.kind === s.kind && (s.kind !== "gallery" || b.dataset.src === s.src);
        b.classList.toggle("is-selected", selected);
      });
    });

    const custom = draft.hero.mode === "custom";
    const heroFrame = editorEl.querySelector('.frame[data-target="hero"]');
    heroFrame.classList.toggle("is-static", !custom);
    heroFrame.classList.toggle("is-off", !draft.inOrbit);
    editorEl.querySelectorAll("#hero-mode button").forEach((b) => b.classList.toggle("is-active", b.dataset.mode === draft.hero.mode));
    $("#hero-zoom").hidden = !custom;
    $("#hero-zoom input").value = draft.hero.zoom;
    editorEl.querySelector('[data-center="hero"]').hidden = !custom;
    editorEl.querySelector('[data-choices="hero"]').hidden = !custom;
    $("#hero-hint").textContent = custom
      ? "Image recadrée en 3:4 pour l'anneau, indépendante de la carte. Glisse pour cadrer, zoome si besoin."
      : "L'anneau reprend la miniature de la carte et son cadrage.";
    $("#in-orbit").checked = draft.inOrbit;
    updateSavebar();
  }

  // Place l'image dans un cadre comme object-fit: cover + object-position,
  // avec un zoom en plus pour la vignette dédiée.
  function geometry(frame, img, s) {
    const fw = frame.clientWidth;
    const fh = frame.clientHeight;
    const scale = Math.max(fw / img.naturalWidth, fh / img.naturalHeight) * (s.zoom || 1);
    const w = img.naturalWidth * scale;
    const h = img.naturalHeight * scale;
    return { w, h, ox: w - fw, oy: h - fh };
  }
  function layout(frame) {
    const img = frame.querySelector("img");
    if (!img.naturalWidth) return;
    const s = draft[frame.dataset.target];
    const g = geometry(frame, img, s);
    Object.assign(img.style, {
      width: `${g.w}px`,
      height: `${g.h}px`,
      left: `${-g.ox * s.x / 100}px`,
      top: `${-g.oy * s.y / 100}px`,
    });
  }

  // Glisser pour cadrer + déposer un fichier image dans l'aperçu.
  function enableFrame(frame) {
    const target = frame.dataset.target;
    let last = null;
    frame.addEventListener("pointerdown", (e) => {
      if (target === "hero" && draft.hero.mode === "same") return;
      last = { x: e.clientX, y: e.clientY };
      frame.setPointerCapture(e.pointerId);
      frame.classList.add("is-dragging");
    });
    frame.addEventListener("pointermove", (e) => {
      if (!last) return;
      const img = frame.querySelector("img");
      if (!img.naturalWidth) return;
      const s = draft[target];
      const g = geometry(frame, img, s);
      if (g.ox > 0.5) s.x = clamp(s.x - ((e.clientX - last.x) / g.ox) * 100);
      if (g.oy > 0.5) s.y = clamp(s.y - ((e.clientY - last.y) / g.oy) * 100);
      last = { x: e.clientX, y: e.clientY };
      update();
    });
    const stop = () => { last = null; frame.classList.remove("is-dragging"); };
    frame.addEventListener("pointerup", stop);
    frame.addEventListener("pointercancel", stop);
    enableFileDrop(frame, (files) => useUpload(target, files[0]));
  }

  /* ---------- rendu des images (dans le navigateur) ---------- */
  function loadImage(src) {
    return new Promise((resolve, reject) => {
      const img = new Image();
      img.onload = () => resolve(img);
      img.onerror = () => reject(new Error("Image illisible : " + src));
      img.src = url(src);
    });
  }
  function toWebp(canvas) {
    const data = canvas.toDataURL("image/webp", 0.85);
    if (!data.startsWith("data:image/webp")) throw new Error("Ce navigateur ne sait pas créer de WebP : utilise Chrome ou Edge.");
    return data;
  }
  function blobToDataUrl(blob) {
    return new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onload = () => resolve(reader.result);
      reader.onerror = () => reject(new Error("Lecture de l'image impossible."));
      reader.readAsDataURL(blob);
    });
  }
  // Photo de galerie ou couverture : ${WEB_MAX}px max sur le grand côté, en
  // JPEG, ou en WebP si l'image a de la transparence (logo PNG…).
  async function prepareImage(file) {
    if (!file || !file.type.startsWith("image/")) throw new Error(`${file?.name || "Fichier"} : ce n'est pas une image.`);
    const source = URL.createObjectURL(file);
    try {
      const img = await loadImage(source).catch(() => {
        throw new Error(`${file.name} : format non pris en charge (utilise du JPEG, PNG ou WebP).`);
      });
      const scale = Math.min(1, WEB_MAX / Math.max(img.naturalWidth, img.naturalHeight));
      const w = Math.round(img.naturalWidth * scale);
      const h = Math.round(img.naturalHeight * scale);
      const canvas = Object.assign(document.createElement("canvas"), { width: w, height: h });
      const ctx = canvas.getContext("2d", { willReadFrequently: true });
      ctx.imageSmoothingQuality = "high";
      ctx.drawImage(img, 0, 0, w, h);
      const alpha = !/jpe?g/.test(file.type) && hasTransparency(ctx, w, h);
      const type = alpha ? "image/webp" : "image/jpeg";
      const blob = await new Promise((resolve) => canvas.toBlob(resolve, type, alpha ? 0.9 : 0.86));
      if (!blob || blob.type !== type) throw new Error("Ce navigateur ne sait pas convertir les images : utilise Chrome ou Edge.");
      const src = URL.createObjectURL(blob);
      pending.set(src, { blob, name: file.name });
      return src;
    } finally {
      URL.revokeObjectURL(source);
    }
  }
  function hasTransparency(ctx, w, h) {
    const px = ctx.getImageData(0, 0, w, h).data;
    for (let i = 3; i < px.length; i += 4) if (px[i] < 255) return true;
    return false;
  }
  // Miniature de carte : image entière, 1000px de large max.
  async function renderCard(src) {
    const img = await loadImage(src);
    const w = Math.min(CARD_MAX_W, img.naturalWidth);
    const h = Math.round((img.naturalHeight * w) / img.naturalWidth);
    const canvas = Object.assign(document.createElement("canvas"), { width: w, height: h });
    const ctx = canvas.getContext("2d");
    ctx.imageSmoothingQuality = "high";
    ctx.drawImage(img, 0, 0, w, h);
    return toWebp(canvas);
  }
  // Vignette de l'anneau : recadrée en 3:4 comme dans l'aperçu.
  async function renderHero(s) {
    const img = await loadImage(s.src);
    const { w: W, h: H } = HERO_SIZE;
    const scale = Math.max(W / img.naturalWidth, H / img.naturalHeight) * s.zoom;
    const w = img.naturalWidth * scale;
    const h = img.naturalHeight * scale;
    const canvas = Object.assign(document.createElement("canvas"), { width: W, height: H });
    const ctx = canvas.getContext("2d");
    ctx.imageSmoothingQuality = "high";
    ctx.drawImage(img, -(w - W) * s.x / 100, -(h - H) * s.y / 100, w, h);
    return toWebp(canvas);
  }

  async function pendingBody(src) {
    const { blob, name } = pending.get(src);
    return { name, image: await blobToDataUrl(blob) };
  }

  // Envoie ce qui a changé ; renvoie l'identifiant du projet.
  async function saveProject() {
    const isNew = project.isNew;
    const body = isNew ? { create: { category: tab } } : { id: project.id };

    if (isNew || !same(draft.info, saved.info)) {
      if (!draft.info.title.trim()) throw new Error("Le titre est obligatoire.");
      const tags = draft.info.tags.split(",").map((t) => t.trim()).filter(Boolean);
      body.info = {
        title: draft.info.title,
        client: draft.info.client,
        description: draft.info.description,
        tags: draft.info.frame ? [draft.info.frame, ...tags] : tags,
      };
    }

    if (tab === "videos") {
      if (isNew || !same(draft.video, saved.video)) {
        const keep = draft.video.link === saved.video.link && project.media;
        const media = keep ? project.media : parseVideoLink(draft.video.link);
        if (!media) throw new Error("Lien vidéo non reconnu : colle un lien YouTube ou Vimeo.");
        body.media = { type: media.type, src: media.src, vertical: draft.video.vertical };
      }
      if (draft.cover !== saved.cover) body.cover = await pendingBody(draft.cover);
      else if (isNew) throw new Error("Ajoute une image de couverture.");
    } else if (isNew || !same(draft.gallery, saved.gallery)) {
      if (!draft.gallery.length) throw new Error("Ajoute au moins une image à la galerie.");
      body.gallery = [];
      for (const g of draft.gallery) {
        body.gallery.push(pending.has(g.src) ? { ...(await pendingBody(g.src)), alt: g.alt } : { src: g.src, alt: g.alt });
      }
    }

    if (!same(draft.card, saved.card)) {
      const c = draft.card;
      if (!c.src) throw new Error("Ajoute une image pour la miniature.");
      body.card = { kind: c.kind, position: pos(c) };
      if (c.kind === "gallery") {
        if (tab === "videos") body.card.fromCover = true;
        else if (pending.has(c.src)) body.card.galleryIndex = draft.gallery.findIndex((g) => g.src === c.src);
        else body.card.src = c.src;
      }
      if (c.kind !== "current") body.card.image = await renderCard(c.src);
    }
    if (heroChanged()) {
      body.hero = draft.hero.mode === "same"
        ? { mode: "same" }
        : { mode: "custom", image: await renderHero(draft.hero) };
    }
    if (draft.inOrbit !== saved.inOrbit) body.inOrbit = draft.inOrbit;
    return (await post("/api/project", body)).id;
  }

  /* =========================================================
     Onglet anneau du hero
     ========================================================= */
  function renderOrbitTab() {
    const inRing = orbitDraft.map(byId).filter(Boolean);
    const others = CATEGORIES.map((c) => ({
      c,
      list: data.projects[c].filter((p) => !orbitDraft.includes(p.id)),
    }));
    const tile = (p, i) => {
      const o = orbitImage(p);
      return `<figure data-id="${p.id}">
        <div class="thumb"><img src="${url(o.src)}" alt="" style="object-position:${o.position}">${i !== undefined ? `<span class="num">${i + 1}</span>` : ""}</div>
        <figcaption>${p.title}</figcaption>
        <div class="tools">${i !== undefined
          ? `<button type="button" data-act="left" title="Avancer" ${i === 0 ? "disabled" : ""}>←</button>
             <button type="button" data-act="right" title="Reculer" ${i === inRing.length - 1 ? "disabled" : ""}>→</button>
             <button type="button" data-act="remove" title="Retirer de l'anneau">×</button>`
          : `<button type="button" data-act="add">+ Ajouter</button>`}</div>
      </figure>`;
    };
    editorEl.innerHTML = `
      <h2>Anneau du hero</h2>
      <p class="hint">Les projets qui tournent autour de ton portrait, dans cet ordre. Conseillé : entre 6 et 10.
        Pour changer la vignette d'un projet, ouvre-le dans son onglet.</p>
      <section class="block">
        <h3>Dans l'anneau (${inRing.length})</h3>
        ${inRing.length ? `<div class="ring">${inRing.map(tile).join("")}</div>` : `<p class="empty">Aucun projet : l'anneau se remplira tout seul avec 8 projets.</p>`}
      </section>
      ${others.filter((o) => o.list.length).map((o) => `
        <section class="block">
          <h3>Ajouter : ${CATEGORY_LABEL[o.c]}</h3>
          <div class="ring ring--add">${o.list.map((p) => tile(p)).join("")}</div>
        </section>`).join("")}
    `;
    editorEl.querySelectorAll("[data-act]").forEach((b) => {
      b.addEventListener("click", () => {
        const id = b.closest("figure").dataset.id;
        const i = orbitDraft.indexOf(id);
        const act = b.dataset.act;
        if (act === "add") orbitDraft.push(id);
        if (act === "remove") orbitDraft.splice(i, 1);
        if (act === "left") [orbitDraft[i - 1], orbitDraft[i]] = [orbitDraft[i], orbitDraft[i - 1]];
        if (act === "right") [orbitDraft[i + 1], orbitDraft[i]] = [orbitDraft[i], orbitDraft[i + 1]];
        renderOrbitTab();
      });
    });
    updateSavebar();
  }

  /* =========================================================
     Onglet ordre des carrousels
     ========================================================= */
  function currentOrder() {
    return Object.fromEntries(CATEGORIES.map((c) => [c, data.projects[c].map((p) => p.id)]));
  }

  // Carrousels vidéos et graphisme : au chargement, la 2e carte est la
  // grande carte mise en avant (la 1re sur mobile).
  const HAS_FEATURED = { videos: true, photos: false, graphisme: true };

  function renderOrderTab() {
    const tile = (c, id, i, list) => {
      const p = byId(id);
      return `<figure data-index="${i}">
        <div class="thumb"><img src="${url(p.thumb || p.cover)}" alt="" draggable="false" style="object-position:${p.thumbPosition || "50% 50%"}">
          <span class="num">${i + 1}</span>${HAS_FEATURED[c] && i === 1 ? `<span class="flag">En avant</span>` : ""}</div>
        <figcaption>${esc(p.title)}</figcaption>
        <div class="tools">
          <button type="button" data-act="left" title="Avancer" ${i === 0 ? "disabled" : ""}>←</button>
          <button type="button" data-act="right" title="Reculer" ${i === list.length - 1 ? "disabled" : ""}>→</button>
        </div>
      </figure>`;
    };
    editorEl.innerHTML = `
      <h2>Ordre des carrousels</h2>
      <p class="hint">L'ordre des projets dans chaque carrousel du site, de gauche à droite.
        Fais glisser une carte sur une autre pour la déplacer, ou utilise les flèches.</p>
      ${CATEGORIES.map((c) => `
        <section class="block">
          <h3>${CATEGORY_TITLE[c]} (${orderDraft[c].length})</h3>
          <p class="hint">${HAS_FEATURED[c]
            ? "Au chargement, la carte n°2 est la grande carte mise en avant (sur mobile, c'est la n°1)."
            : "Au chargement, la photo n°1 est la première à gauche."}</p>
          <div class="ring order${c === "photos" ? " is-square" : ""}" data-category="${c}">
            ${orderDraft[c].map((id, i, list) => tile(c, id, i, list)).join("")}
          </div>
        </section>`).join("")}
    `;

    editorEl.querySelectorAll(".order[data-category]").forEach((grid) => {
      const list = orderDraft[grid.dataset.category];
      grid.querySelectorAll("[data-act]").forEach((b) => {
        b.addEventListener("click", () => {
          const i = Number(b.closest("figure").dataset.index);
          move(list, i, b.dataset.act === "left" ? i - 1 : i + 1);
          renderOrderTab();
        });
      });
      sortable(grid, list, renderOrderTab);
    });
    updateSavebar();
  }

  /* =========================================================
     Enregistrement
     ========================================================= */
  function updateSavebar() {
    const dirty = isDirty();
    saveBtn.textContent = project?.isNew && CATEGORIES.includes(tab) ? "Créer le projet" : "Enregistrer";
    saveBtn.disabled = !dirty;
    resetBtn.disabled = !dirty;
    let warn = "";
    if (tab === "orbit" && dirty && orbitDraft.length && (orbitDraft.length < 4 || orbitDraft.length > 12)) {
      warn = ` (${orbitDraft.length} projets : l'anneau rend mieux entre 6 et 10)`;
    }
    setStatus(dirty ? "Modifications non enregistrées" + warn : "");
  }

  function setStatus(text, kind) {
    const el = $("#status");
    el.textContent = text;
    el.className = kind ? `is-${kind}` : "";
  }

  async function post(path, body) {
    const res = await fetch(path, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(body),
    });
    const result = await res.json().catch(() => ({}));
    if (!res.ok) throw Object.assign(new Error(result.error || "Erreur à l'enregistrement"), { detail: result.detail });
    return result;
  }

  saveBtn.addEventListener("click", async () => {
    saveBtn.disabled = true;
    setStatus("Enregistrement…");
    try {
      const created = CATEGORIES.includes(tab) && project?.isNew;
      let keepId = project?.id;
      if (tab === "orbit") await post("/api/orbit", { ids: orbitDraft });
      else if (tab === "order") await post("/api/order", { order: orderDraft });
      else keepId = await saveProject();
      await loadData(keepId);
      setStatus(created ? "Projet créé ✓" : "Enregistré ✓", "ok");
    } catch (err) {
      setStatus(err.message, "error");
      saveBtn.disabled = false;
    }
    refreshGit();
  });

  resetBtn.addEventListener("click", () => {
    if (tab === "orbit") {
      orbitDraft = [...data.heroOrbit];
      renderOrbitTab();
    } else if (tab === "order") {
      orderDraft = currentOrder();
      renderOrderTab();
    } else {
      draft = structuredClone(saved);
      renderProject();
    }
  });

  window.addEventListener("beforeunload", (e) => {
    if (isDirty()) e.preventDefault();
  });

  /* =========================================================
     Publication sur GitHub (commit + push de tous les changements)
     ========================================================= */
  const publishDialog = $("#publish");
  const publishGo = $("#publish-go");
  const publishMessage = $("#publish-message");
  let gitState = null; // { branch, upstream, ahead, changes: [{ code, path }] } ou { error }

  async function refreshGit() {
    try {
      const res = await fetch("/api/git", { cache: "no-store" });
      gitState = await res.json();
      if (!res.ok) throw new Error(gitState.detail || gitState.error);
    } catch (err) {
      gitState = { error: err.message };
    }
    const count = $("#publish-open .count");
    count.textContent = gitState.error ? "" : gitState.changes.length || (gitState.ahead ? "↑" : "");
  }

  function changeLabel(code) {
    if (code === "??" || code.includes("A")) return "nouveau";
    if (code.includes("D")) return "supprimé";
    if (code.includes("R")) return "renommé";
    return "modifié";
  }

  function setPublishStatus(text, kind, detail) {
    const el = $("#publish-status");
    el.textContent = text;
    el.className = kind ? `is-${kind}` : "";
    $("#publish-log").hidden = !detail;
    $("#publish-log").textContent = detail || "";
  }

  // Remplit la fenêtre à partir de gitState.
  function renderPublish() {
    const g = gitState;
    const list = $("#publish-changes");
    list.innerHTML = "";
    $("#publish-warn").textContent = isDirty()
      ? "Des modifications ne sont pas enregistrées dans l'onglet ouvert : elles ne seront pas publiées."
      : "";
    if (g.error) {
      $("#publish-intro").textContent = "Impossible de lire l'état de git.";
      $("#publish-field").hidden = true;
      publishGo.disabled = true;
      return setPublishStatus("", "", g.error);
    }
    const files = g.changes.length;
    $("#publish-intro").textContent = files
      ? `${files} fichier${files > 1 ? "s" : ""} à envoyer sur GitHub (branche ${g.branch}). Le site en ligne sera à jour une ou deux minutes après.`
      : g.ahead
        ? `Aucun nouveau changement, mais ${g.ahead} commit${g.ahead > 1 ? "s" : ""} pas encore envoyé${g.ahead > 1 ? "s" : ""} sur GitHub.`
        : "Rien à publier : GitHub est à jour.";
    g.changes.forEach((c) => {
      const li = document.createElement("li");
      li.innerHTML = `<span class="what">${changeLabel(c.code)}</span><span class="file"></span>`;
      li.querySelector(".file").textContent = c.path;
      list.appendChild(li);
    });
    $("#publish-field").hidden = !files;
    publishGo.textContent = files ? "Publier" : "Envoyer";
    publishGo.disabled = !files && !g.ahead && Boolean(g.upstream);
  }

  $("#publish-open").addEventListener("click", async () => {
    setPublishStatus("");
    await refreshGit();
    renderPublish();
    publishDialog.showModal();
    if (!publishGo.disabled) (gitState.changes.length ? publishMessage : publishGo).focus();
  });
  $("#publish-close").addEventListener("click", () => publishDialog.close());

  publishGo.addEventListener("click", async () => {
    publishGo.disabled = true;
    setPublishStatus("Envoi en cours…");
    try {
      await post("/api/publish", {
        message: publishMessage.value,
        paths: gitState.changes.map((c) => c.path),
      });
      await refreshGit();
      renderPublish();
      setPublishStatus("Publié ✓ Le site en ligne sera à jour d'ici une ou deux minutes.", "ok");
    } catch (err) {
      await refreshGit();
      renderPublish();
      setPublishStatus(err.message, "error", err.detail);
    }
  });

  loadData();
  refreshGit();
</script>
</body>
</html>
